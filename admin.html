<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin – Heavensquill</title>
<link rel="stylesheet" href="style.css">
<style>
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.tools input{flex:1;min-width:180px}
.tools .btn{padding:.6rem 1rem}
.chipbar{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0 1rem}
.chipbar button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:.4rem .9rem;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer}
.chipbar button.on{border-color:var(--blue);color:var(--blue);background:var(--glow)}
.orders{display:grid;gap:.75rem}
.ord{display:grid;grid-template-columns:1fr auto;gap:.25rem 1rem;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:1rem 1.1rem;font:inherit;cursor:pointer;transition:.2s}
.ord:hover{border-color:var(--blue);transform:translateY(-2px)}
.ord b{font:500 1.1rem var(--serif)}.ord small{color:var(--muted)}
.badge{align-self:start;font-size:.8rem;padding:.2rem .7rem;border-radius:99px;border:1px solid var(--blue);color:var(--blue)}
.badge.Selesai{border-color:#5fbf8a;color:#5fbf8a}.badge.Batal{border-color:#8c9db2;color:#8c9db2}.badge.Baru{background:var(--blue);color:#07121c}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--blue);border-radius:8px;padding:1.5rem;width:min(560px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(5,9,14,.75)}
dialog form{margin:0;max-width:none;gap:.8rem}
.err{color:#ff8f8f;min-height:1.3em}
.msg{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
</style></head><body>
<main><div class="wrap" style="padding:0 1.25rem">
<div class="top-bar"><a class="brand" href="index.html">Heavensquill <span class="msg">· Admin</span></a><button class="btn" id="logout" hidden>Keluar</button></div>

<section id="login" style="max-width:420px;margin:4rem auto">
<h1>Masuk admin</h1>
<form id="loginf"><label>Kata sandi<input type="password" id="pw" required autocomplete="current-password"></label>
<button class="btn main" type="submit">Masuk</button><p class="err" id="lerr" role="alert"></p></form>
<p class="msg">Kata sandi ada di Apps Script (fungsi setup). Halaman ini publik, tapi data pesanan hanya terbuka dengan kata sandi itu.</p>
</section>

<section id="app" hidden>
<div class="chipbar" id="chips"></div>
<div class="tools"><input type="search" id="q" placeholder="Cari nama, judul, atau ID"><button class="btn" id="reload">Muat ulang</button><button class="btn" id="add">+ Pesanan manual</button><button class="btn" id="csv">Ekspor CSV</button></div>
<p class="msg" id="sum" aria-live="polite"></p>
<div class="orders" id="list"></div>
</section>
</div></main>

<dialog id="dlg"><form id="df" method="dialog">
<h2 id="dt">Pesanan</h2>
<div class="grid2"><label>Nama<input name="nama" required></label><label>Username Discord<input name="kontak"></label></div>
<label>Judul novel<input name="judul" required></label>
<div class="grid2"><label>Bahasa asal<input name="asal"></label><label>Bahasa tujuan<input name="tujuan"></label></div>
<div class="grid2"><label>Jumlah kata<input name="kata" type="number" min="0"></label><label>Paket<input name="paket"></label></div>
<div class="grid2"><label>Tenggat<input name="tenggat"></label><label>Status<select name="status" id="st"></select></label></div>
<label>Harga (Rp)<input name="harga" type="number" min="0"></label>
<label>Catatan pembeli<textarea name="catatan" rows="2"></textarea></label>
<label>Catatan admin (internal)<textarea name="catatan_admin" rows="2"></textarea></label>
<p class="err" id="derr" role="alert"></p>
<div class="btns" style="margin:0"><button class="btn main" type="submit">Simpan</button><a class="btn" id="wa" target="_blank" rel="noopener">Buka Discord</a><button class="btn" type="button" id="cp">Salin balasan</button><button class="btn" type="button" id="del">Hapus</button><button class="btn" type="button" id="close">Tutup</button></div>
</form></dialog>
<script src="config.js"></script><script src="admin.js"></script>
</body></html>
